name: Publish

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # Auth is via npm trusted publishing (OIDC) — no token needed.
      # Requires the trusted publisher connection on the npm package page.
      - run: npm publish --provenance --access public
